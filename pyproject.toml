[project]
name = "strix-telegram-bot"
version = "2.0.0"
description = "Remote Control Center UI for STRIX v1 via Telegram"
requires-python = ">=3.12"
dependencies = [
    "strix-agent==1.5.3",
]

# Explicit package discovery so setuptools ignores unrelated top-level dirs
# such as docker/ and install/ (they are NOT Python packages and would
# otherwise trigger a "Multiple top-level packages" flat-layout error).
[tool.setuptools]
packages = { find = { include = ["strix_telegram_bot*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
